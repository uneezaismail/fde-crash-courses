name: project-06-opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: gemini-3.5-flash-lite
          use_github_token: true
          prompt: |
            Review this pull request for bugs, code quality issues, and security risks.
            Run pytest to verify the test suite. Do not modify files, commit, or push changes.
            Post your review verdict (PASS or FAIL with specific reasons) as a comment on the PR.
